name: Deploy Wisconsin Fuel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to publish after the price refresh
        type: string
        required: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    steps:
      - name: Check out the static site
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage the site for publication
        run: |
          rsync -a \
            --exclude='/data/gasbuddy-export.br.b64' \
            --exclude='/data/gasbuddy-page-sample.json' \
            --exclude='/data/geocode-cache.json' \
            --exclude='/data/terminal-report.txt' \
            site/ "$RUNNER_TEMP/wisconsin-fuel/"
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wisconsin-fuel
      - name: Wait for the uploaded artifact to be available
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..6}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq .total_count) && [[ "$count" == 1 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo 'Pages artifact did not become available.' >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Allow Pages artifact metadata to propagate
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry GitHub Pages deployment
        id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
